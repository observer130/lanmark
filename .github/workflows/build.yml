name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 测试门禁：此前 CI 只构建不跑测试，绿灯只代表「能编译」，单测失败的提交
  # 依然可以合入甚至发版。这里把 tsc / vitest / cargo test 接进来，三端构建
  # 都以它为前置（构建分钟数远高于测试，先失败更省）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # cargo test 需要编译 tauri，缺 webkit2gtk 等系统库会直接挂
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: 类型门禁 + 前端构建
        run: pnpm build
      - name: 前端测试
        run: pnpm test
      - name: Rust 测试
        run: cd src-tauri && cargo test
      # clippy 以 -D warnings 接入：存量告警已在本次修完，别再放回来。
      # 暂不接 cargo fmt --check：全仓有 331 处 rustfmt 差异（词表数组是手工对齐的），
      # 一次性格式化会把它们全冲掉，收益不抵 diff 噪声。
      - name: Rust lint
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

  desktop-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lanmark-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  desktop-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lanmark-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Resolve NDK path (取最高版本)
        run: echo "NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n1)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # gen/android 已提交（含 buildToolsVersion 钉 34.0.0 / 腾讯 gradle 镜像定制），无需再 init
      - name: Build debug APK (arm64, debug 签名可直接安装)
        run: pnpm tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: lanmark-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
