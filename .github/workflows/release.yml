name: release

on:
  push:
    tags:
      - 'v*'

# 仓库默认 GITHUB_TOKEN 为只读；上传 release 资产需要 contents:write
# （只读默认下允许按 workflow 提权，最小授权）
permissions:
  contents: write

# 构建失败不应留下半成品 release：release 正文先由 gh release create 建好，
# 产物上传失败时 release 页仍只有说明，不误导下载。
#
# 并发：同一个 tag 的重跑/强推必须串行。旧 run 若晚到会把过期的 latest.json
# 覆盖新 run 的结果（更新器按 latest.json 判定版本）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 前置闸门：tag 必须与三处版本号一致，否则产物内版本与 release 页/更新器
  # 对不上（更新器按 latest.json 的 version 比较，可能静默不更新）。
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag 与三处版本号一致
        run: |
          TAG="${GITHUB_REF_NAME}"
          for f in package.json src-tauri/tauri.conf.json; do
            V=$(jq -r .version "$f")
            if [ "v$V" != "$TAG" ]; then
              echo "::error::$f 版本 $V 与 tag $TAG 不一致"
              exit 1
            fi
          done
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "v$CARGO" != "$TAG" ]; then
            echo "::error::src-tauri/Cargo.toml 版本 $CARGO 与 tag $TAG 不一致"
            exit 1
          fi

  desktop-linux:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # 只发原生二进制（AppImage 有 Intel Arc 兼容性问题）；deb/AppImage 不进 release（2026-09-18 定）
      - run: pnpm tauri build --no-bundle
      - name: 打包原生二进制
        run: tar -czf lanmark-linux-x64.tar.gz -C src-tauri/target/release lanmark
      # M5-6：给 tar.gz 出 minisign 签名（与 Windows updater 同一密钥）——
      # Linux 自更新（update_install_linux）下载后先验签再替换二进制
      - name: 检查 updater 签名私钥
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret 未配置——拒绝产出无签名的自更新资产"
            exit 1
          fi
      - name: 签名 tar.gz
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri signer sign lanmark-linux-x64.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            lanmark-linux-x64.tar.gz
            lanmark-linux-x64.tar.gz.sig
          fail_on_unmatched_files: true

  desktop-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # M5-5：updater 签名私钥（向导生成，GitHub secrets；缺失即 fail——
      # 不静默产出未签名的更新资产，与 Android keystore 的 M4g 纪律一致）
      - name: 检查 updater 签名私钥
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret 未配置——拒绝构建无签名更新资产"
            exit 1
          fi
      # 只发 NSIS 安装包；msi 不进 release（2026-09-18 定）。
      # createUpdaterArtifacts 走 --config overlay 而非写死在 tauri.conf.json：
      # 写死的话本地任何打包构建都要求 TAURI_SIGNING_PRIVATE_KEY（lanmark-desktop.sh
      # 的 --no-bundle 不受影响，但裸 build 会挂）。overlay 只影响这一处 CI 构建。
      - name: Build NSIS + updater 资产
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: >
          pnpm tauri build --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":true}}'
      # latest.json：updater 插件的静态清单（端点固定指向
      # releases/latest/download/latest.json，始终解析到最新一版）。
      # signature 必须是 .sig 文件的**内容**（不是路径/URL）。
      - name: 生成 latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="${GITHUB_REF_NAME}"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n1)
          SIG=$(cat "${SETUP}.sig")
          URL="https://github.com/observer130/lanmark/releases/download/${TAG}/$(basename "$SETUP")"
          NOTES=$(gh release view "$TAG" --json body --jq .body 2>/dev/null | head -c 500 || true)
          jq -n --arg v "$VERSION" --arg notes "$NOTES" --arg sig "$SIG" --arg url "$URL" \
            '{version: $v, notes: $notes, pub_date: (now | todate),
              platforms: { "windows-x86_64": { signature: $sig, url: $url } } }' > latest.json
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            latest.json
          fail_on_unmatched_files: true

  android:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Resolve NDK path (取最高版本)
        run: echo "NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n1)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # gen/android 已提交（含 buildToolsVersion 钉 34.0.0），无需再 init
      #
      # M4g：改用**固定 release keystore** 签名。
      # 此前用 --debug 构建 → debug keystore 由 AGP 在每台全新 runner 上随机生成
      # → 每个版本签名都不同 → 用户只能卸载重装（应用目录用户的笔记库会一起没）。
      - name: 解码 release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE secret 未配置——拒绝构建未固定签名的 release 资产"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/lanmark-release.keystore"
          echo "LANMARK_KEYSTORE_PATH=$RUNNER_TEMP/lanmark-release.keystore" >> "$GITHUB_ENV"
      # 真实 release 构建（非 --debug）：走 signingConfigs.release + R8 混淆
      - name: Build release APK (arm64, 固定 release 签名)
        env:
          LANMARK_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LANMARK_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LANMARK_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: pnpm tauri android build --apk --target aarch64
      # 签名固定性：不只是「不是 debug 签名」，还必须等于**预期证书指纹**。
      # 只排除 debug 的话，换错 release keystore 也能通过，用户端覆盖安装会
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE（属于发错包）。
      - name: 校验签名指纹
        env:
          EXPECTED_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::产物仍是 debug 签名——release keystore 未生效"
            exit 1
          fi
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::未配置 RELEASE_CERT_SHA256 secret，无法确认签名与历史版本一致"
            echo "取值方法：apksigner verify --print-certs <已发布APK> | grep 'SHA-256'"
            exit 1
          fi
          ACTUAL=$(grep -i "SHA-256" /tmp/certs.txt | head -1 | awk -F': ' '{print $NF}' | tr -d ' :' | tr 'A-F' 'a-f')
          EXPECT=$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECT" ]; then
            echo "::error::APK 证书指纹不符（实际 $ACTUAL，预期 $EXPECT）——keystore 换过或配错"
            exit 1
          fi
      - name: 重命名为 release 资产名
        run: |
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             lanmark-android-aarch64.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: lanmark-android-aarch64.apk
          fail_on_unmatched_files: true
