[package]
name = "lanmark"
version = "0.2.0"
description = "Lanmark — LAN-first markdown notes"
authors = ["observer-37"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lanmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 钉死 tauri 版本：patches/tauri-runtime-wry 是 2.11.4 的 vendor 补丁（[patch.crates-io]）。
# 若 caret 浮动让 cargo update 把 tauri 升到依赖 tauri-runtime-wry ≥2.12 的版本，
# 补丁将不再匹配 → 构建失败或白屏 bug（tauri#15671）回归。
# 升级 tauri 时必须同步重做补丁（见 patches/README.md）并解除此 pin。
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
tauri-plugin-dialog = "2.7.3"
base64 = "0.23.1"
# M2 同步：手机端 axum 服务器 + 桌面端 HTTP 客户端 + mDNS 发现
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
mdns-sd = "0.21"
tauri-plugin-log = "2.9.1"
log = "0.4.34"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
# base64 已在 dependencies（dev 作用域自动继承，重复声明是冗余）
tempfile = "3.27.0"

# tauri#15671：移动端零窗口时 Resumed 事件被丢弃 → FGS 保活进程重开白屏。
# 上游修复未发布，本地补丁透传 Resumed 到 App 层（配合 lib.rs 的窗口重建）。
# 补丁是上游 2.11.4 的 vendor 副本，仅 src/lib.rs 有 7 行差异（见 patches/README.md）；
# 路径必须入库——.cache/ 被 gitignore，放那里的话 CI 全新 checkout 会三端全挂。
[patch.crates-io]
tauri-runtime-wry = { path = "../patches/tauri-runtime-wry" }
