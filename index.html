<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // M6c 首帧防闪白：外观真源是 AppConfig（设备偏好，异步 IPC 读取），赶不上
      // 首帧 —— 这里同步读 applyScheme/applyFont 写下的启动缓存副本，先把
      // <html data-scheme> / <html data-font> 落位（深色用户冷启动不再闪一帧白，
      // 换字体也不再先闪一帧默认字）。M7 起配色与字体是两个独立 key。
      // 未知值不匹配任何 `:root[data-scheme=…]` / `:root[data-font=…]` 块
      // ⇒ 自动落回浅色 + 默认字体，安全；缓存被清只退化为一帧闪白，
      // 设置不丢（真源仍是 AppConfig）。
      // 这段必须内联在 <head>：任何模块脚本/外链都晚于首帧。
      try {
        var s = localStorage.getItem("lanmark-scheme");
        if (s) document.documentElement.dataset.scheme = s;
        var f = localStorage.getItem("lanmark-font");
        if (f) document.documentElement.dataset.font = f;
      } catch (e) {
        /* localStorage 不可用（隐私模式等）：忽略 */
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanmark</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
